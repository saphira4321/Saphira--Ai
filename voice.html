
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saphira AI - Voice Studio</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#050816,#1a0f3d,#0b1f5c);
color:white;
padding:20px;
}
.logo{
font-size:34px;
font-weight:bold;
text-align:center;
color:#7b5cff;
margin-bottom:20px;
}
.back{
color:#7b5cff;
text-decoration:none;
font-weight:bold;
}
.box{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
margin-top:20px;
}
textarea{
width:100%;
height:140px;
padding:15px;
border:none;
border-radius:15px;
box-sizing:border-box;
font-size:16px;
}
select{
width:100%;
padding:14px;
margin-top:15px;
border-radius:12px;
border:none;
}
button{
width:100%;
margin-top:20px;
padding:15px;
border:none;
border-radius:40px;
background:#7b5cff;
color:white;
font-size:18px;
font-weight:bold;
}
#result{
margin-top:20px;
text-align:center;
}
</style>
</head>

<body>

<a href="index.html" class="back">← Back</a>

<div class="logo">Saphira AI</div>

<div class="box">

<h2>Voice Studio</h2>

<textarea id="speechText" placeholder="Type what you want Saphira AI to speak..."></textarea>

<select id="voice">
<option>Alloy</option>
<option>Nova</option>
<option>Echo</option>
<option>Onyx</option>
</select>

<button onclick="generateSpeech()">Generate Voice</button>

<div id="result"></div>

</div>

<script>
async function generateSpeech(){

const text=document.getElementById("speechText").value.trim();

if(!text){
alert("Please type something.");
return;
}

const button=document.querySelector("button");

button.disabled=true;
button.innerHTML="🎙️ Generating Voice...";

try{

const response=await fetch("/api/speech",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({text})
});

const data=await response.json();

document.getElementById("result").innerHTML=
`<p>${data.message}</p><p>"${data.text}"</p>`;

}catch(err){

document.getElementById("result").innerHTML=
`<p>${err.message}</p>`;

}finally{

button.disabled=false;
button.innerHTML="Generate Voice";

}

}
</script>

</body>
</html>
