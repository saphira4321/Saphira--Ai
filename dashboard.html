
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saphira AI Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#050816,#1a0f3d,#0b1f5c);
color:white;
padding:20px;
}

.logo{
text-align:center;
font-size:38px;
font-weight:bold;
color:#7b5cff;
margin-top:20px;
}

.sub{
text-align:center;
color:#cfc6ff;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:rgba(255,255,255,.08);
padding:25px;
border-radius:22px;
text-align:center;
text-decoration:none;
color:white;
transition:.2s;
}

.card:hover{
background:rgba(123,92,255,.25);
}

.icon{
font-size:38px;
margin-bottom:12px;
}

.title{
font-size:18px;
font-weight:bold;
}

footer{
margin-top:40px;
text-align:center;
color:#9f8cff;
font-size:14px;
}
</style>
</head>

<body>

<div class="logo">Saphira AI</div>
<div class="sub">Create Images, Videos, Voices & Chat with AI.</div>

<div class="grid">

<a class="card" href="image.html">
<div class="icon">🖼️</div>
<div class="title">Image Studio</div>
</a>

<a class="card" href="video.html">
<div class="icon">🎥</div>
<div class="title">Video Studio</div>
</a>

<a class="card" href="voice.html">
<div class="icon">🎙️</div>
<div class="title">Voice Studio</div>
</a>

<a class="card" href="chat.html">
<div class="icon">💬</div>
<div class="title">AI Chat</div>
</a>

</div>

<footer>Powered by Saphira AI ✨</footer>

</body>
</html>
