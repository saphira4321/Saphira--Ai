<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saphira AI Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#050816,#1a0f3d,#0b1f5c);
color:white;
padding:20px;
}

.logo{
font-size:36px;
font-weight:bold;
color:#7b5cff;
text-align:center;
margin-bottom:30px;
}

.card{
background:rgba(255,255,255,0.08);
border-radius:20px;
padding:20px;
margin-bottom:20px;
}

.card h2{
margin:0 0 10px;
color:#7b5cff;
}

.button{
display:block;
text-decoration:none;
text-align:center;
background:#7b5cff;
color:white;
padding:15px;
border-radius:40px;
margin-top:15px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="logo">Saphira AI</div>

<div class="card">
<h2>AI Image Generator</h2>
<p>Create amazing AI images from text prompts.</p>
<a href="#" class="button">Open</a>
</div>

<div class="card">
<h2>AI Video Generator</h2>
<p>Create videos from your ideas.</p>
<a href="#" class="button">Open</a>
</div>

<div class="card">
<h2>Text to Speech</h2>
<p>Turn text into realistic voices.</p>
<a href="#" class="button">Open</a>
</div>

</body>
</html>
