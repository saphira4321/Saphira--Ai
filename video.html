
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saphira AI - Video Studio</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#050816,#1a0f3d,#0b1f5c);
color:white;
padding:20px;
}
.logo{
font-size:34px;
font-weight:bold;
text-align:center;
color:#7b5cff;
margin-bottom:20px;
}
.box{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
}
textarea{
width:100%;
height:120px;
padding:15px;
border:none;
border-radius:15px;
box-sizing:border-box;
font-size:16px;
}
.upload{
display:block;
margin:15px 0 8px;
font-weight:bold;
color:#cfc6ff;
}
input[type=file]{
width:100%;
padding:12px;
border:2px dashed #7b5cff;
border-radius:12px;
background:rgba(255,255,255,.05);
color:white;
box-sizing:border-box;
}
#preview{
display:none;
width:100%;
max-width:280px;
margin:15px auto;
border-radius:15px;
border:2px solid #7b5cff;
}
.row{
display:flex;
gap:10px;
margin-top:15px;
}
.row button{
flex:1;
padding:12px;
border:none;
border-radius:30px;
background:#2d2355;
color:white;
font-weight:bold;
cursor:pointer;
}
.row button.active{
background:#7b5cff;
}
.main{
width:100%;
margin-top:20px;
padding:15px;
border:none;
border-radius:40px;
background:#7b5cff;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
#result{
margin-top:20px;
text-align:center;
}
</style>
</head>

<body>

<div class="logo">Saphira AI</div>

<div class="box">

<h2>Video Studio</h2>

<textarea id="prompt" placeholder="Describe the video you want to create..."></textarea>

<label class="upload">📷 Reference Image (Optional)</label>

<input type="file" id="file" accept="image/*">

<img id="preview">

<div class="row">
<button id="btn5" class="active">5s</button>
<button id="btn10">10s</button>
<button id="btn15">15s</button>
</div>

<button id="generateBtn" class="main">Generate Video</button>

<div id="result"></div>

</div>

<script>
let duration=5;

const preview=document.getElementById("preview");
const fileInput=document.getElementById("file");

fileInput.addEventListener("change",()=>{
const f=fileInput.files[0];
if(f){
preview.src=URL.createObjectURL(f);
preview.style.display="block";
}
});

function select(btn,d){
duration=d;
document.querySelectorAll(".row button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

document.getElementById("btn5").addEventListener("click",()=>select(document.getElementById("btn5"),5));
document.getElementById("btn10").addEventListener("click",()=>select(document.getElementById("btn10"),10));
document.getElementById("btn15").addEventListener("click",()=>select(document.getElementById("btn15"),15));

document.getElementById("generateBtn").addEventListener("click",async()=>{

const prompt=document.getElementById("prompt").value.trim();

if(!prompt){
alert("Please enter a video prompt.");
return;
}

const btn=document.getElementById("generateBtn");
btn.disabled=true;
btn.innerHTML="Generating...";

try{

const res=await fetch("/api/video",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({prompt,duration})
});

const data=await res.json();

document.getElementById("result").innerHTML=
`🎥 ${data.message}<br>Duration: ${data.duration}s`;

}catch(e){

document.getElementById("result").innerHTML=
"Connection error.";

}

btn.disabled=false;
btn.innerHTML="Generate Video";

});
</script>

</body>
</html>
