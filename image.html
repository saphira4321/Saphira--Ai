
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saphira AI - Image Studio</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#050816,#1a0f3d,#0b1f5c);
color:white;
padding:20px;
}

.logo{
font-size:34px;
font-weight:bold;
text-align:center;
color:#7b5cff;
margin-bottom:20px;
}

.back{
color:#7b5cff;
text-decoration:none;
font-weight:bold;
}

.box{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
margin-top:20px;
}

textarea{
width:100%;
height:120px;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
box-sizing:border-box;
}

.upload{
display:block;
margin-top:15px;
margin-bottom:8px;
font-weight:bold;
color:#cfc6ff;
}

input[type=file]{
width:100%;
padding:12px;
border:2px dashed #7b5cff;
border-radius:12px;
background:rgba(255,255,255,.05);
color:white;
box-sizing:border-box;
}

.button{
width:100%;
margin-top:20px;
padding:15px;
border:none;
border-radius:40px;
background:#7b5cff;
color:white;
font-size:18px;
font-weight:bold;
}

#previewBox{
display:none;
margin-top:20px;
text-align:center;
}

#previewImage{
width:100%;
max-width:300px;
border-radius:15px;
border:2px solid #7b5cff;
}

#result{
margin-top:25px;
text-align:center;
}
</style>
</head>

<body>

<a href="dashboard.html" class="back">← Back to Dashboard</a>

<div class="logo">Saphira AI</div>

<div class="box">

<h2>AI Image Studio</h2>

<p>Describe what you want to create.</p>

<textarea id="prompt" placeholder="Example: A futuristic African queen wearing glowing purple armor..."></textarea>

<label class="upload">📷 Reference Image (Optional)</label>

<input type="file" id="referenceImage" accept="image/*">

<div id="previewBox">
<img id="previewImage">
</div>

<button class="button" onclick="generateImage()">Generate Image</button>

<div id="result"></div>

</div>

<script>
const fileInput=document.getElementById("referenceImage");
const previewBox=document.getElementById("previewBox");
const previewImage=document.getElementById("previewImage");

fileInput.addEventListener("change",function(){
const file=this.files[0];
if(file){
previewImage.src=URL.createObjectURL(file);
previewBox.style.display="block";
}
});

async function generateImage(){

const prompt=document.getElementById("prompt").value.trim();

if(!prompt){
alert("Please enter a prompt.");
return;
}

const button=document.querySelector(".button");
const result=document.getElementById("result");

button.disabled=true;
button.innerHTML="✨ Generating...";

try{

const response=await fetch("/api/image",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({prompt})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error||"Generation failed");
}

result.innerHTML=`<img src="data:image/png;base64,${data.data[0].b64_json}" style="width:100%;border-radius:20px;margin-top:15px;">`;

}catch(error){

result.innerHTML=`<p style="color:#ffb3b3;">${error.message}</p>`;

}finally{

button.disabled=false;
button.innerHTML="Generate Image";

}

}
</script>

</body>
</html>
