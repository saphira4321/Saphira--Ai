<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Saphira AI - Image Generator</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#050816,#1a0f3d,#0b1f5c);

padding:20px;
}

.logo{
font-size:36px;
font-weight:bold;
color:#7b5cff;
text-align:center;
margin-bottom:20px;
}

.back{

font-weight:bold;
}

.box{

}

.button{

<a href="dashboard.html" class="back">← Back to Dashboard</a>
