<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saphira AI - Image Studio</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#050816,#1a0f3d,#0b1f5c);
color:white;
padding:20px;
}
.logo{
text-align:center;
font-size:34px;
font-weight:bold;
color:#7b5cff;
margin-bottom:20px;
}
.box{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
}
textarea{
width:100%;
height:120px;
padding:15px;
border:none;
border-radius:15px;
box-sizing:border-box;
font-size:16px;
}
.upload{
display:block;
margin:15px 0 8px;
font-weight:bold;
color:#cfc6ff;
}
input[type=file]{
width:100%;
padding:12px;
border:2px dashed #7b5cff;
border-radius:12px;
background:rgba(255,255,255,.05);
color:white;
box-sizing:border-box;
}
#preview{
display:none;
width:100%;
max-width:280px;
margin:15px auto;
border-radius:15px;
border:2px solid #7b5cff;
}
.chips{
display:flex;
gap:8px;
overflow-x:auto;
margin:18px 0;
padding-bottom:5px;
}
.chips button{
padding:10px 16px;
border:none;
border-radius:20px;
background:#2d2355;
color:white;
white-space:nowrap;
font-weight:bold;
}
.chips button.active{
background:#7b5cff;
}
.main{
width:100%;
padding:15px;
border:none;
border-radius:40px;
background:#7b5cff;
color:white;
font-size:18px;
font-weight:bold;
margin-top:15px;
}
.secondary{
width:100%;
padding:13px;
border:none;
border-radius:40px;
background:#2d2355;
color:white;
font-size:16px;
font-weight:bold;
margin-top:10px;
}
#result{
margin-top:20px;
text-align:center;
}
</style>
</head>

<body>

<div class="logo">Saphira AI</div>

<div class="box">

<h2>Image Studio</h2>

<textarea id="prompt" placeholder="Describe the image you want..."></textarea>

<label class="upload">📷 Reference Image (Optional)</label>

<input type="file" id="file" accept="image/*">

<img id="preview">

<h3>✨ Quick Styles</h3>

<div class="chips">
<button id="c1" class="active">🎬 Cinematic</button>
<button id="c2">📸 Realistic</button>
<button id="c3">✨ Anime</button>
<button id="c4">🎮 3D</button>
<button id="c5">🌸 Ghibli</button>
<button id="c6">🎭 Clay</button>
</div>

<button id="enhanceBtn" class="secondary">✨ Enhance Prompt</button>

<button id="generateBtn" class="main">Generate Image</button>

<div id="result"></div>

</div>

<script>
let style="Cinematic";

const preview=document.getElementById("preview");
const fileInput=document.getElementById("file");

fileInput.addEventListener("change",()=>{
const f=fileInput.files[0];
if(f){
preview.src=URL.createObjectURL(f);
preview.style.display="block";
}
});

const buttons=[
["c1","Cinematic"],
["c2","Realistic"],
["c3","Anime"],
["c4","3D"],
["c5","Ghibli"],
["c6","Clay"]
];

buttons.forEach(([id,name])=>{
document.getElementById(id).addEventListener("click",()=>{
style=name;
buttons.forEach(([i])=>document.getElementById(i).classList.remove("active"));
document.getElementById(id).classList.add("active");
});
});

document.getElementById("enhanceBtn").addEventListener("click",()=>{
const box=document.getElementById("prompt");
const text=box.value.trim();

if(!text){
alert("Write a prompt first.");
return;
}

box.value=`${style} masterpiece, ultra detailed, cinematic lighting, 8K quality, realistic textures, professional composition, ${text}`;
});

document.getElementById("generateBtn").addEventListener("click",async()=>{

const prompt=document.getElementById("prompt").value.trim();

if(!prompt){
alert("Please enter an image prompt.");
return;
}

const btn=document.getElementById("generateBtn");
btn.disabled=true;
btn.innerHTML="Generating...";

try{

const res=await fetch("/api/image",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({prompt})
});

const data=await res.json();

if(data.data&&data.data[0]&&data.data[0].b64_json){
document.getElementById("result").innerHTML=
`<img src="data:image/png;base64,${data.data[0].b64_json}" style="width:100%;border-radius:15px;margin-top:15px;">`;
}else{
document.getElementById("result").innerHTML=
`<p>${data.error||"Image generation requires API credits."}</p>`;
}

}catch(e){

document.getElementById("result").innerHTML="Connection error.";

}

btn.disabled=false;
btn.innerHTML="Generate Image";

});
</script>

</body>
</html>
